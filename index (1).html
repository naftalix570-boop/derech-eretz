async function addTemps(list){
 if(!list||!list.length) return;
 const u='https://api.open-meteo.com/v1/forecast?current=temperature_2m&timezone=auto&latitude='+list.map(x=>x.lat.toFixed(3)).join(',')+'&longitude='+list.map(x=>x.lng.toFixed(3)).join(',');
 const j=await (await fetch(u)).json(); const arr=Array.isArray(j)?j:[j];
 if(arr.length!==list.length) return;
 arr.forEach((r,i)=>{ if(r&&r.current&&r.current.temperature_2m!=null) list[i].temp=Math.round(r.current.temperature_2m); }); }

document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t) return; const f=A[t.dataset.a]; if(f){ e.preventDefault(); f(t.dataset.v); } });
document.addEventListener('input',e=>{ if(e.target.id==='rq'){ W.q=e.target.value; const l=$('#rlist'); if(l) l.innerHTML=regionList(); } if(e.target.id==='wn') W.notes=e.target.value; if(e.target.id==='sq') SR.q=e.target.value; if(e.target.id==='rt') RF.text=e.target.value; });
document.addEventListener('change',async e=>{ if(e.target.id!=='rph') return; const files=[...e.target.files].slice(0,3-RF.photos.length); const t=$('#rt'); if(t) RF.text=t.value;
 for(const f of files){ try{ let d=await compressImg(f,800,.7); if(d.length>330000) d=await compressImg(f,600,.6); if(d.length>330000){ toast('התמונה גדולה מדי'); continue; } RF.photos.push(d); }catch(err){ toast('לא הצלחנו לקרוא את התמונה'); } }
 drawReview(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='aq') A.send(); if(e.key==='Enter'&&e.target.id==='sq') A.doSearch(); });

if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
if(fbAuth){ fbAuth.getRedirectResult().catch(()=>{});
 fbAuth.onAuthStateChanged(async u=>{
  if(u){ user={id:u.uid,name:(u.displayName||'מטייל').split(' ')[0],email:u.email,cloud:true}; try{ localStorage.setItem('campai:user',JSON.stringify(user)); }catch(e){}
   await cloudLoad(); if(!location.hash||location.hash==='#/') location.hash='#/home'; render(); }
  else if(user&&user.cloud){ user=null; try{ localStorage.removeItem('campai:user'); }catch(e){} S=blank(); render(); } }); }
startTrack();
render();
</script>
</body>
</html>
